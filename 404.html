<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — Famille Chevalier</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        .lost{min-height:78vh;display:flex;align-items:center}
        .lost .wrap{max-width:660px}
        .lost h1{font-size:clamp(2rem,4.5vw,3rem);margin:14px 0 18px}
        .lost p{color:var(--ink-2);font-size:1.08rem;max-width:52ch}
        .lost .links{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:32px}

<body>
<header class="site-header">
    <div class="wrap">
        <a class="brand" href="/">
            <b>Famille Chevalier</b><small>Maison d’édition jeunesse</small>
        </a>
    </div>
</header>

<section class="lost">
    <div class="wrap">
        <span class="eyebrow">Erreur 404</span>
        <h1>Cette page n’existe pas <em>(ou plus)</em>.</h1>
        <p>Le lien est peut-être ancien, ou l’adresse comporte une coquille. Nos dix-sept livres, eux, sont toujours là.</p>
        <div class="links">
            <a class="btn" href="/#catalogue">Voir le catalogue</a>
            <a class="link arrow" href="/#offert">Recevoir un livre offert</a>
        </div>
    </div>
</section>

<footer>
    <div class="wrap">
        <p class="copy">© Famille Chevalier · <a href="mailto:contact@editions-chevalier.fr">contact@editions-chevalier.fr</a></p>
    </div>
</footer>

</html>
